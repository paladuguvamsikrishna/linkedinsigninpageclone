    <title>Document</title>

    <style>

        h1{

        .apple-logo{

        }

        a{

        }

<body>

    <div class="box">
            <img src="https://logoeps.com/wp-content/uploads/2025/02/LinkedIn-logo-.png" alt="" class="linkedin-logo">
       <div class="sign-in">

        <button> <img src="https://tse4.mm.bing.net/th/id/OIP.8QehHn1i3PEPr3ivNJP2fAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt=""> &nbsp;Continue with google</button>
        <br>
        <br>

        </p>

        <fieldset>

        <br>
        <input type="text" placeholder="">
        <br>

        <br>
        <input type="password" placeholder="">
        <br>
        <br>
        <a href="">Forgot password?</a>
        <br>
        <br>
        <input type="checkbox" name="Sign" id="checkbox">
        <label for="Sign">Keep me signed in</label>
        <br>
        <br>\
        <button type="submit" class="sign-btn">Sign in</button>
        <br><br>
        </fieldset>
       
        </form>
       </div> 

    </div>
